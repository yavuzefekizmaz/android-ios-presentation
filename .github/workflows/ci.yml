name: Derleme ve sunum kontrolü
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Üretim önizlemesini başlat
        run: npm run preview -- --port 4173 > /tmp/obsidian-preview.log 2>&1 &
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: |
            qa/test-results.json
            qa/mobile-results.json
